<script>
        // ============================================
        // 1) SETUP: mic button (unchanged from before)
        // ============================================
        const micToggle = document.getElementById('mic-toggle');
        const micIcon = document.getElementById('mic-icon');
        let isRecording = false;

        micToggle.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                micToggle.classList.replace('bg-primary', 'bg-tertiary');
                micIcon.textContent = 'graphic_eq';
                micToggle.classList.add('animate-pulse');
            } else {
                micToggle.classList.replace('bg-tertiary', 'bg-primary');
                micIcon.textContent = 'mic';
                micToggle.classList.remove('animate-pulse');
            }
        });

        // ============================================
        // 2) TALK TO OUR OWN SERVER (not Gemini directly!)
        // ============================================
        // The Gemini API key and Luna's personality instructions now live
        // on the server (see server.js), not here. This page just sends
        // the conversation to our own "/api/luna" endpoint and gets back
        // Luna's reply. That way the secret key is never visible to anyone
        // viewing this page's source.
        // If you're opening this page with the Live Server extension
        // (usually http://127.0.0.1:5500), it can't run our API for us -
        // it only serves static files. So we point straight at our
        // Node server instead, which needs to be running separately
        // (npm start, in its own terminal). If you're NOT using Live
        // Server and instead just visiting http://localhost:3000/chat.html
        // (i.e. the Node server is serving this page too), you can leave
        // this as-is; it still works either way.
        const LUNA_ENDPOINT = "http://localhost:3000/api/luna";

        // Keep track of the conversation so Luna remembers earlier turns.
        let conversationHistory = [];

        // ============================================
        // 3) SIMPLE CRISIS SAFETY NET
        // ============================================
        // If a message contains any of these words, we skip calling the AI
        // completely and show the crisis resources right away instead.
        // This way, the most serious messages always get the exact same
        // safe, predictable response - not whatever the AI decides to say.
        const CRISIS_KEYWORDS = [
            "kill myself", "suicide", "end my life", "want to die",
            "hurt myself", "self harm", "self-harm", "harming myself",
            "being abused", "someone is hurting me"
        ];

        function containsCrisisLanguage(text) {
            const lower = text.toLowerCase();
            return CRISIS_KEYWORDS.some(word => lower.includes(word));
        }

        // ============================================
        // 4) CHAT UI HELPERS
        // ============================================
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(text, sender) {
            const wrapper = document.createElement('div');
            const isLuna = sender === 'luna';

            wrapper.className = isLuna
                ? "flex items-end gap-3 animate-in fade-in slide-in-from-bottom-4 duration-500"
                : "flex items-end justify-end gap-3 animate-in fade-in slide-in-from-bottom-4 duration-500";

            wrapper.innerHTML = isLuna
                ? `
                    <div class="w-8 h-8 rounded-full bg-primary-fixed flex-shrink-0 flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary text-[18px]">auto_awesome</span>
                    </div>
                    <div class="max-w-[75%] bg-primary-container text-on-primary-container p-4 rounded-2xl rounded-bl-none soft-elevation">
                        <p class="font-body-md text-body-md"></p>
                    </div>
                `
                : `
                    <div class="max-w-[75%] bg-secondary-container text-on-secondary-container p-4 rounded-2xl rounded-br-none soft-elevation">
                        <p class="font-body-md text-body-md"></p>
                    </div>
                `;

            // Set text this way (not innerHTML) so a student's typed message
            // can never accidentally be run as HTML/script.
            wrapper.querySelector('p').textContent = text;

            chatContainer.appendChild(wrapper);
            window.scrollTo(0, document.body.scrollHeight);
        }

        function showTyping() {
            const typing = document.createElement('div');
            typing.className = "flex items-end gap-3";
            typing.id = "typing-indicator";
            typing.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-primary-fixed flex-shrink-0 flex items-center justify-center opacity-50">
                    <span class="material-symbols-outlined text-primary text-[18px]">auto_awesome</span>
                </div>
                <div class="bg-surface-container p-4 rounded-2xl rounded-bl-none flex gap-1 items-center">
                    <span class="w-2 h-2 bg-outline rounded-full typing-dot"></span>
                    <span class="w-2 h-2 bg-outline rounded-full typing-dot"></span>
                    <span class="w-2 h-2 bg-outline rounded-full typing-dot"></span>
                </div>
            `;
            chatContainer.appendChild(typing);
            window.scrollTo(0, document.body.scrollHeight);
        }

        function hideTyping() {
            const typing = document.getElementById('typing-indicator');
            if (typing) typing.remove();
        }

        // ============================================
        // 5) ASK LUNA (via our own server, which talks to Gemini)
        // ============================================
        async function askLuna(userText) {
            // Add the student's new message to the running history
            conversationHistory.push({ role: "user", parts: [{ text: userText }] });

            const response = await fetch(LUNA_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: conversationHistory })
            });

            if (!response.ok) {
                throw new Error("Luna server request failed: " + response.status);
            }

            const data = await response.json();
            const lunaText = data.reply
                || "Sorry, I had trouble finding the words just now. Could you say that again?";

            // Save Luna's reply too, so she remembers it next turn
            conversationHistory.push({ role: "model", parts: [{ text: lunaText }] });

            return lunaText;
        }

        // ============================================
        // 6) MAIN SEND FLOW
        // ============================================
        async function sendMessage(text) {
            const trimmed = text.trim();
            if (!trimmed) return;

            addMessage(trimmed, 'student');
            chatInput.value = '';

            // Safety net: handle crisis language ourselves, don't ask the AI
            if (containsCrisisLanguage(trimmed)) {
                addMessage(
                    "That sounds really serious, and I care about you. This isn't something to handle alone - please use the Crisis Support button above so you can reach someone who can help right now.",
                    'luna'
                );
                return;
            }

            showTyping();
            try {
                const reply = await askLuna(trimmed);
                hideTyping();
                addMessage(reply, 'luna');
            } catch (err) {
                hideTyping();
                console.error(err);
                addMessage("Hmm, I'm having trouble connecting right now. Mind trying again in a moment?", 'luna');
            }
        }

        sendBtn.addEventListener('click', () => sendMessage(chatInput.value));
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage(chatInput.value);
        });

        // Suggestion chips send their own label as the message
        document.querySelectorAll('.chip-btn').forEach(btn => {
            btn.addEventListener('click', () => sendMessage(btn.textContent));
        });

        window.scrollTo(0, document.body.scrollHeight);
    </script>
